[project]
name = "pybibx"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = "3.14.*"
pip = "*"
uv = "*"

[feature.dev.dependencies]
ruff = "*"
pyright = "*"
pytest = "*"
pytest-cov = "*"
pytest-gremlins = "*"
scalene = "*"
vale = "*"

[feature.dev.tasks]
sync = "uv sync --group dev"
# Non-baseline Python 3.14 compatibility probe: legacy extras include gensim.
sync-all-extras = "uv sync --all-extras --group dev"
lint = "ruff check pybibx setup.py tests"
format-check = "ruff format --check pybibx setup.py tests"
typecheck = "pyright"
test = "pytest"
mutate = "uv run pytest-gremlins tests"
profile-ingestion = "uv run scalene --json --outfile .pybibx/profiles/ingestion.scalene.json pybibx/ingestion/parsers.py"
profile-graph = "uv run scalene --json --outfile .pybibx/profiles/graph.scalene.json pybibx/graph/builders.py"
prose = "vale conductor README.md"
swarm-doctor = "python scripts/conductor_swarm.py doctor"

[environments]
default = ["dev"]
